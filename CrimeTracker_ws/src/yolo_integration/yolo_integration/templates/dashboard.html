<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Criminal Detection System</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script>
        let shownAlerts = [];
        let currentPage = 1; // 현재 페이지를 저장

        // 알람 확인 함수
        function checkForAlerts() {
            $.getJSON('/alerts', function(data) {
                data.alerts.forEach(alert => {
                    if (!shownAlerts.includes(alert)) {
                        alert("New Alert: " + alert);
                        shownAlerts.push(alert);
                    }
                });
            });
        }
        setInterval(checkForAlerts, 1000);

        // RViz2 이미지 갱신
        function fetchRvizImage() {
            document.getElementById('rviz-image').src = "/get_rviz_image?t=" + new Date().getTime();
        }

        // 감지된 객체 정보 갱신
        function fetchDetectedObjects() {
            fetch('/detected_objects')
                .then(response => response.json())
                .then(data => {
                    if (data.detected_objects) {
                        let table = '<table><tr><th>ID</th><th>Class</th><th>Object ID</th><th>Confidence</th><th>X</th><th>Y</th><th>Timestamp</th><th>Detected</th></tr>';
                        data.detected_objects.forEach(obj => {
                            table += `<tr>
                                        <td>${obj.id}</td>
                                        <td>${obj.class_name}</td>
                                        <td>${obj.objectid}</td>
                                        <td>${obj.confidence}</td>
                                        <td>${obj.x}</td>
                                        <td>${obj.y}</td>
                                        <td>${obj.timestamp}</td>
                                        <td>${obj.detected}</td>
                                      </tr>`;
                        });
                        table += '</table>';
                        document.getElementById('detected-objects').innerHTML = table;
                    }
                })
                .catch(error => console.error('Error fetching detected objects:', error));
        }

        // 범죄 클래스 검색 (페이지네이션 적용)
        function searchCrime(page = 1) {
            let query = document.getElementById('crime-query').value;
            fetch(`/search_crime?query=${encodeURIComponent(query)}&page=${page}`)
                .then(response => response.json())
                .then(data => {
                    if (data.results) {
                        currentPage = page; // 현재 페이지 저장
                        let table = '<table><tr><th>ID</th><th>Class</th><th>Object ID</th><th>Confidence</th><th>X</th><th>Y</th><th>Timestamp</th><th>Detected</th></tr>';
                        data.results.forEach(obj => {
                            table += `<tr>
                                        <td>${obj.id}</td>
                                        <td>${obj.class_name}</td>
                                        <td>${obj.objectid}</td>
                                        <td>${obj.confidence}</td>
                                        <td>${obj.x}</td>
                                        <td>${obj.y}</td>
                                        <td>${obj.timestamp}</td>
                                        <td>${obj.detected}</td>
                                      </tr>`;
                        });
                        table += '</table>';
                        document.getElementById('search-results').innerHTML = table;

                        // 페이지 네비게이션 생성
                        renderPagination();
                    }
                })
                .catch(error => console.error('Error searching crime:', error));
        }

        // 페이지 네비게이션 버튼 생성
        function renderPagination() {
            const paginationDiv = document.getElementById('pagination');
            paginationDiv.innerHTML = `
                <button onclick="searchCrime(currentPage - 1)" ${currentPage === 1 ? 'disabled' : ''}>Previous</button>
                <span>Page ${currentPage}</span>
                <button onclick="searchCrime(currentPage + 1)">Next</button>
            `;
        }

        // AMR 상태 갱신
        function fetchAmrState() {
            fetch('/amr_state')
                .then(response => response.json())
                .then(data => {
                    if (data.amr_state) {
                        document.getElementById('amr-state').innerText = data.amr_state;
                    }
                })
                .catch(error => console.error('Error fetching AMR state:', error));
        }

        // YOLO Node에서 감지된 이미지 갱신
        function fetchYoloNodeImage() {
            fetch('/get_latest_image')
                .then(response => response.json())
                .then(data => {
                    if (data.image) {
                        document.getElementById('camera-image').src = data.image;
                    }
                })
                .catch(error => console.error('Error fetching YOLO Node image:', error));
        }

        // TurtleBot 이미지 갱신 함수
        function fetchTurtleBotImage() {
            fetch('/get_turtlebot_image')
                .then(response => response.blob())
                .then(blob => {
                    const imageElement = document.getElementById('turtlebot-image');
                    const url = URL.createObjectURL(blob);
                    imageElement.src = url; // 이미지를 URL로 갱신
                })
                .catch(error => console.error('Error fetching TurtleBot image:', error));
        }

        // 주기적으로 TurtleBot 이미지 갱신
        setInterval(fetchTurtleBotImage, 200);  // 0.5초마다 갱신

        // 주기적으로 데이터 갱신
        setInterval(fetchYoloNodeImage, 200);     // YOLO Node 이미지 0.5초마다
        setInterval(fetchRvizImage, 200);         // RViz2 맵 이미지 0.5초마다
        setInterval(fetchDetectedObjects, 200);   // 감지된 객체 정보 0.5초마다
        setInterval(fetchAmrState, 200);          // AMR 상태 0.5초마다

        // 페이지 로드 시 초기 데이터 로드
        $(document).ready(function() {
            fetchYoloNodeImage();
            fetchAmrWebcamImage();
            fetchRvizImage();
            fetchDetectedObjects();
            fetchAmrState();
        });
    </script>
</head>
<body>
    <h1>Criminal Detection System</h1>
    <div class="view-system">
        <!-- 위쪽 3개 창 -->
        <div class="view-item" id="local-webcam-view">
            <h2>YOLO Node Image</h2>
            <img id="camera-image" src="" alt="YOLO Node Image">
        </div>
        
        <div class="view-item" id="amr-webcam-image">
            <h2>AMR Webcam</h2>
            <img id="turtlebot-image" src="/get_turtlebot_image" alt="TurtleBot Image">
        </div>
        
        <div class="view-item" id="rviz-view">
            <h2>AMR Current Location</h2>
            <img id="rviz-image" src="{{ url_for('get_rviz_image') }}" alt="Rviz2 View">
        </div>
        
        <!-- 아래쪽 3개 창 (4-5-6 순서) -->
        <div class="view-item" id="detected-objects-view">
            <h2>Detected Object & Crime Search</h2>
            <input type="text" id="crime-query" placeholder="Enter Class to Search">
            <button onclick="searchCrime(1)">Search</button>
            <div id="search-results">
                <!-- 검색 결과 테이블이 여기에 표시됩니다 -->
            </div>
            <div id="pagination">
                <!-- 페이지 네비게이션 버튼이 여기에 표시됩니다 -->
            </div>
        </div>

        <div class="view-item" id="alert-status-view">
            <h2>Notification Status</h2>
            <div class="alert-indicator" id="alert-indicator">No Alerts</div>
        </div>

        <div class="view-item" id="amr-status-view">
            <h2>AMR Current State</h2>
            <h3>AMR 상태: <span id="amr-state">초기 위치</span></h3>
        </div>
    </div>

    <a href="{{ url_for('alerts') }}">View Alerts</a>
    <a href="{{ url_for('logout') }}">Logout</a>
    
    <script>
        // 알림을 화면에 표시
        function displayAlert(alertMessage) {
            const alertContainer = document.getElementById('alert-indicator');
            alertContainer.innerHTML = alertMessage;
        }

        // 알림을 주기적으로 확인하여 새 알림이 있을 경우 표시
        function fetchLatestAlert() {
            fetch('/alerts')
                .then(response => response.json())
                .then(data => { 
                    if (data.alerts && data.alerts.length > 0) {
                        let alertMessages = data.alerts.join('<br>');
                        displayAlert(alertMessages);
                    } else {
                        displayAlert('No Alerts');
                    }
                })
                .catch(error => {
                    console.error('Error fetching alerts:', error);
                    displayAlert('Error fetching alerts');
                });
        }

        // 1초마다 새 알림을 확인
        setInterval(fetchLatestAlert, 100);  // 1초마다 새 알림을 확인
    </script>
</body>
</html>
